name: Premier workflow CI

on:
  push:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Afficher un message
        run: echo "Hello from GitHub Actions"

      - name: Informations sur le runner
        run: |
          echo "Version de Python :"
          python --version

          echo "Répertoire courant :"
          pwd

          echo "Liste des fichiers :"
          ls -la

      - name: Informations Git
        run: |
          echo "Branche : $GITHUB_REF_NAME"
          echo "Commit : $GITHUB_SHA"
          echo "Événement : $GITHUB_EVENT_NAME"

            - name: Test erreur volontaire
        run: |
          echo "Test d'une erreur volontaire"
          exit 1

      - name: Étape après erreur
        run: echo "Cette étape ne devrait pas être exécutée"